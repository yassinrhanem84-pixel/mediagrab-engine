# Render Blueprint: New > Blueprint > pick this repo > Apply. Everything below is configured automatically.
# Tuned for Render's free machine (512 MB RAM, small temporary disk): one download at a time, small limits.
services:
  - type: web
    name: mediagrab-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PROXY_MODE
        value: render
      - key: ALLOWED_ORIGINS
        value: https://mediagrab-alpha.vercel.app
      - key: PLAYLIST_MAX
        value: "10"
      - key: MAX_ACTIVE_DOWNLOADS
        value: "1"
      - key: MAX_DOWNLOADS_PER_VISITOR
        value: "1"
      - key: MAX_FILE_BYTES
        value: "1073741824"
      - key: MIN_FREE_DISK_GB
        value: "0.5"
      - key: FILE_TTL_SECONDS
        value: "600"
